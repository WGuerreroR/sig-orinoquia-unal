server {
    listen 80;
    server_name _;

    # Carpeta donde se copian tus archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # Esto hace que todas las rutas funcionen en una SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Servir archivos estáticos más rápido
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Opcional: GZIP
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml;
    gzip_proxied any;
    gzip_min_length 1024;
}
